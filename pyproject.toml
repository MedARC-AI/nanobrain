[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "nanobrain"
description = "Small brain MRI foundation models, pretrained with self-supervised learning"
version = "0.1.0"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "brainmarks-smri",
    "einops",
    "jaxtyping",
    "matplotlib",
    "nibabel",
    "numpy",
    "nvidia-ml-py",
    "omegaconf",
    "pandas",
    "timm",
    "torch==2.14.0",
    "torchvision",
    "wandb",
]

[dependency-groups]
dev = [
    "ipython",
    "jupyter",
    "matplotlib",
    "pre-commit",
    "pytest",
    "python-dotenv",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = ["F722"]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
brainmarks-smri = { git = "https://github.com/MedARC-AI/brainmarks-smri.git", rev = "d1eef0e91a7da5ce62aab15d1e7f437d89555d4b" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
